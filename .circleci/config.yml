version: 2.1

orbs:
  codecov: codecov/codecov@6.0.0

executors:
  node:
    parameters:
      version:
        type: string
        default: lts
    docker:
      - image: cimg/node:<< parameters.version >>
    working_directory: ~/marpit

commands:
  install:
    parameters:
      force:
        type: boolean
        default: false
      postinstall:
        type: steps
        default: []
    steps:
      - restore_cache:
          keys:
            - v3-dependencies-{{ .Environment.CIRCLE_JOB }}-{{ checksum "package-lock.json" }}-{{ .Branch }}
            - v3-dependencies-{{ .Environment.CIRCLE_JOB }}-{{ checksum "package-lock.json" }}-
            - v3-dependencies-{{ .Environment.CIRCLE_JOB }}-

      - run: npm ci <<# parameters.force >>--force<</ parameters.force >>
      - steps: << parameters.postinstall >>

      - save_cache:
          key: v2.3-dependencies-{{ .Environment.CIRCLE_JOB }}-{{ checksum "package-lock.json" }}-{{ .Branch }}
          paths:
            - ~/.npm

  audit:
    steps:
      - checkout:
          method: blobless
      - install:
          postinstall:
            - run: npm -s run check:audit

  prepare:
    parameters:
      force:
        type: boolean
        default: false
    steps:
      - run: node --version

      - checkout:
          method: blobless

      - install:
          force: << parameters.force >>

  lint:
    steps:
      - run:
          name: Prettier formatting
          command: npm run check:format

      - run:
          name: ESLint
          command: npm run lint:js

      - run:
          name: stylelint
          command: npm run lint:css

  test:
    parameters:
      junit:
        type: boolean
        default: true
    steps:
      - run:
          name: Jest
          command: npm run test:coverage -- --ci --maxWorkers=2 --reporters=default <<# parameters.junit >>--reporters=jest-junit<</ parameters.junit >>
          environment:
            JEST_JUNIT_OUTPUT_DIR: tmp/test-results

      - codecov/upload

      - when:
          condition: << parameters.junit >>
          steps:
            - store_test_results:
                path: tmp/test-results

      - store_artifacts:
          path: ./coverage
          destination: coverage

jobs:
  audit:
    executor: node
    steps:
      - audit

  test-node18:
    executor:
      name: node
      version: '18.20'
    steps:
      - prepare:
          force: true
      - test:
          junit: false

  test-node20:
    executor:
      name: node
      version: '20.20'
    steps:
      - prepare
      - lint
      - test

  test-node22:
    executor:
      name: node
      version: '22.23'
    steps:
      - prepare
      - lint
      - test

  test-node24:
    executor:
      name: node
      version: '24.20'
    steps:
      - prepare
      - lint
      - test

  test-node26:
    executor:
      name: node
      version: '26.8.1' # Specify version for development
    steps:
      - prepare
      - lint
      - test

workflows:
  test:
    jobs:
      - audit
      - test-node18:
          requires:
            - audit
      - test-node20:
          requires:
            - audit
      - test-node22:
          requires:
            - audit
      - test-node24:
          requires:
            - audit
      - test-node26:
          requires:
            - audit
